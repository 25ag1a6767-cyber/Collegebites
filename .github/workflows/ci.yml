name: CollegeBites CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: collegebites_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run migrations & pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/collegebites_test
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/collegebites_test
          TEST_REDIS_URL: redis://127.0.0.1:6379/1
        run: |
          alembic upgrade head
          pytest -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Web typecheck, build & test
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run test
          npm run build
