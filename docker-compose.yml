services:
  postgres:
    image: postgres:16-alpine
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
      -c random_page_cost=1.1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: collegebites_dev_password
      POSTGRES_DB: collegebites
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://postgres:collegebites_dev_password@postgres:5432/collegebites
      REDIS_URL: redis://redis:6379/0
      DB_POOL_SIZE: "12"
      DB_MAX_OVERFLOW: "18"
      UVICORN_WORKERS: "4"
      CACHE_ENABLED: "true"
      SECRET_KEY: change-me-in-production-min-64-chars-secret-key-collegebites-docker
      QR_SIGNING_SECRET: change-me-in-production-min-64-chars-qr-secret-collegebites-docker
      RAZORPAY_TEST_MODE: "true"
      PASSWORD_RESET_TOKEN_EXPIRY_MINUTES: "30"
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && python -m app.cli.seed_demo && python run_prod.py"

  worker:
    build: ./backend
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:collegebites_dev_password@postgres:5432/collegebites
      REDIS_URL: redis://redis:6379/0
    command: celery -A app.workers.celery_app worker --loglevel=info

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pg_data:
